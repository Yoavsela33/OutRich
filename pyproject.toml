[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outrich"
version = "0.1.0"
description = "AI-powered B2B outreach pipeline — lead discovery, qualification, and personalization at scale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "google-genai>=1.0.0",
    "instructor>=1.3.0",
    "apify-client>=1.7.0",
    "google-api-python-client>=2.100.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
outrich = "outrich.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/outrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
